apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-lens
  labels:
    app: llm-lens
spec:
  replicas: 2
  selector:
    matchLabels:
      app: llm-lens
  template:
    metadata:
      labels:
        app: llm-lens
    spec:
      containers:
        - name: llm-lens
          image: ghcr.io/your-org/llm-lens:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
